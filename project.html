<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #07070f;
    --surface: #0e0e1c;
    --border: #1e1e38;
    --accent: #e8f000;
    --accent-dim: rgba(232,240,0,0.10);
    --text: #f0eefc;
    --muted: #7b7a99;
    --card-bg: #0b0b18;
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 15px;
    line-height: 1.7;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 3px,
      rgba(0,0,0,0.04) 3px,
      rgba(0,0,0,0.04) 4px
    );
    pointer-events: none;
    z-index: 1000;
  }

  /* ─── NAV ─── */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1.25rem 3rem;
    background: rgba(7,7,15,0.85);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }

  .nav-logo {
    font-family: 'Orbitron', monospace;
    font-weight: 900;
    font-size: 1rem;
    color: var(--accent);
    letter-spacing: 0.1em;
    text-decoration: none;
  }

  .nav-back {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-family: 'DM Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    text-decoration: none;
    transition: color 0.2s;
  }
  .nav-back:hover { color: var(--accent); }
  .nav-back::before { content: '←'; }

  /* ─── HERO ─── */
  .project-hero {
    min-height: 60vh;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 8rem 3rem 4rem;
    position: relative;
    overflow: hidden;
    border-bottom: 1px solid var(--border);
  }

  .hero-cover {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    filter: brightness(0.25) saturate(0.7);
  }

  .hero-cover-placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Orbitron', monospace;
    font-weight: 900;
    font-size: 12vw;
    color: rgba(232,240,0,0.05);
    overflow: hidden;
  }
  .hero-cover-placeholder::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(232,240,0,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(232,240,0,0.03) 1px, transparent 1px);
    background-size: 48px 48px;
  }

  .hero-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(7,7,15,0.95) 0%, rgba(7,7,15,0.5) 50%, rgba(7,7,15,0.2) 100%);
  }

  .project-hero-content {
    position: relative;
    z-index: 1;
    max-width: 900px;
    animation: fadeUp 0.6s ease both;
  }

  .project-number-tag {
    font-family: 'DM Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    color: var(--accent);
    margin-bottom: 1rem;
    opacity: 0.7;
  }

  h1.project-title {
    font-family: 'Orbitron', monospace;
    font-weight: 900;
    font-size: clamp(2rem, 5vw, 4rem);
    line-height: 1.1;
    color: var(--text);
    margin-bottom: 1.5rem;
  }

  .project-meta-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem;
  }

  .tag {
    font-family: 'DM Mono', monospace;
    font-size: 0.62rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 0.3em 0.85em;
    border: 1px solid var(--border);
    color: var(--muted);
  }
  .tag.accent {
    border-color: rgba(232,240,0,0.4);
    color: var(--accent);
    background: var(--accent-dim);
  }

  /* ─── CONTENT ─── */
  .project-content {
    max-width: 1100px;
    margin: 0 auto;
    padding: 5rem 3rem;
  }

  .content-grid {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 5rem;
    align-items: start;
  }

  .section-label {
    font-family: 'DM Mono', monospace;
    font-size: 0.68rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 1.25rem;
  }

  h2.block-title {
    font-family: 'Orbitron', monospace;
    font-weight: 700;
    font-size: 1.2rem;
    color: var(--text);
    margin-bottom: 1.25rem;
    line-height: 1.3;
  }

  .prose {
    color: var(--muted);
    font-size: 0.88rem;
    line-height: 1.9;
  }
  .prose p { margin-bottom: 1.2rem; }
  .prose p:last-child { margin-bottom: 0; }

  /* ─── Inline screenshots ─── */
  .prose .screenshot {
    display: block;
    margin: 2rem 0;
  }
  .prose .screenshot img {
    width: 100%;
    display: block;
    border: 1px solid var(--border);
    filter: brightness(0.92) saturate(0.9);
    transition: filter 0.3s;
  }
  .prose .screenshot img:hover {
    filter: brightness(1) saturate(1);
  }
  .prose .screenshot figcaption {
    font-size: 0.68rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-top: 0.6rem;
    opacity: 0.7;
  }
  /* Two-column screenshot grid */
  .prose .screenshot-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
    margin: 2rem 0;
  }
  .prose .screenshot-grid .screenshot {
    margin: 0;
  }
  @media (max-width: 600px) {
    .prose .screenshot-grid { grid-template-columns: 1fr; }
  }

  .content-block {
    margin-bottom: 3.5rem;
    padding-bottom: 3.5rem;
    border-bottom: 1px solid var(--border);
  }
  .content-block:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }

  /* Sidebar */
  .sidebar { position: sticky; top: 6rem; }

  .sidebar-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    padding: 1.75rem;
    margin-bottom: 1.5rem;
  }

  .sidebar-label {
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.5rem;
  }

  .sidebar-value {
    font-family: 'Syne', sans-serif;
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--text);
  }

  .sidebar-row {
    padding: 0.85rem 0;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-row:last-child { border-bottom: none; }

  /* Achievements list */
  .achievements-list { list-style: none; }

  .achievements-list li {
    display: flex;
    gap: 1rem;
    padding: 1rem 0;
    border-bottom: 1px solid var(--border);
    font-size: 0.85rem;
    color: var(--muted);
    line-height: 1.6;
  }
  .achievements-list li:last-child { border-bottom: none; }

  .achievement-icon {
    flex-shrink: 0;
    width: 28px; height: 28px;
    background: var(--accent-dim);
    border: 1px solid rgba(232,240,0,0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.7rem;
    color: var(--accent);
    font-family: 'Orbitron', monospace;
    font-weight: 700;
    margin-top: 0.1rem;
  }

  /* Nav between projects */
  .project-nav {
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 3rem 5rem;
    display: flex;
    justify-content: space-between;
    gap: 1rem;
  }

  .project-nav-link {
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
    text-decoration: none;
    padding: 1.5rem;
    background: var(--card-bg);
    border: 1px solid var(--border);
    flex: 1;
    transition: border-color 0.2s;
    max-width: 280px;
  }
  .project-nav-link:hover { border-color: var(--accent); }

  .nav-link-label {
    font-size: 0.65rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .nav-link-title {
    font-family: 'Orbitron', monospace;
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--text);
  }

  .project-nav-link.next { text-align: right; margin-left: auto; }
  .project-nav-link.prev .nav-link-label::before { content: '← '; }
  .project-nav-link.next .nav-link-label::after { content: ' →'; }

  /* ─── ANIMATIONS ─── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .reveal {
    opacity: 0;
    transform: translateY(24px);
    transition: opacity 0.6s ease, transform 0.6s ease;
  }
  .reveal.visible { opacity: 1; transform: translateY(0); }

  /* ─── RESPONSIVE ─── */
  @media (max-width: 900px) {
    nav { padding: 1rem 1.5rem; }
    .project-hero { padding: 6rem 1.5rem 3rem; }
    .project-content { padding: 3rem 1.5rem; }
    .content-grid { grid-template-columns: 1fr; gap: 2rem; }
    .sidebar { position: static; }
    .project-nav { padding: 0 1.5rem 3rem; }
  }
</style>
</head>

<script>
// ─── Screenshot helper ───
// Usage inside description / roleDescription strings:
//   ${img("images/screenshot.png")}              → full-width image, no caption
//   ${img("images/screenshot.png", "Caption")}   → full-width image with caption
//   ${img2("images/a.png", "images/b.png")}      → two images side by side
function img(src, caption = "") {
  return `<figure class="screenshot">
    <img src="${src}" alt="${caption}">
    ${caption ? `<figcaption>${caption}</figcaption>` : ""}
  </figure>`;
}
function img2(src1, caption1, src2, caption2) {
  // caption args are optional — call as img2("a.png","",  "b.png","") if no captions
  return `<div class="screenshot-grid">
    ${img(src1, caption1 || "")}
    ${img(src2, caption2 || "")}
  </div>`;
}

// ─── Load project from URL param ───
function getProjectId() {
  const params = new URLSearchParams(window.location.search);
  const id = parseInt(params.get('id'));
  return isNaN(id) ? 0 : Math.max(0, Math.min(id, PROJECTS.length - 1));
}

function renderProject(id) {
  const p = PROJECTS[id];

  document.title = p.title + ' — GD Portfolio';

  // Hero — image or gradient placeholder
  const coverImg = document.getElementById('hero-cover-img');
  const placeholder = document.getElementById('hero-placeholder');
  if (p.heroImage) {
    coverImg.src = p.heroImage;
    coverImg.alt = p.title;
    coverImg.style.display = 'block';
    placeholder.style.display = 'none';
  } else {
    coverImg.style.display = 'none';
    placeholder.style.display = 'flex';
    placeholder.textContent = p.number;
    placeholder.style.background = p.bgColor;
  }
  document.getElementById('project-number').textContent = `// Project ${p.number}`;
  document.getElementById('project-title').textContent = p.title;

  const tagsEl = document.getElementById('project-tags');
  tagsEl.innerHTML = p.tags.map(t =>
    `<span class="tag${t === p.accentTag ? ' accent' : ''}">${t}</span>`
  ).join('');

  // Sidebar info
  document.getElementById('info-engine').textContent = p.engine;
  document.getElementById('info-role').textContent = p.role;
  document.getElementById('info-duration').textContent = p.duration;
  document.getElementById('info-team').textContent = p.team;
  document.getElementById('info-platform').textContent = p.platform;

  // Link button
  if (p.link) {
    document.getElementById('link-btn-container').innerHTML =
      `<a href="${p.link}" target="_blank" class="btn btn-primary" style="
        display:block; width:100%; text-align:center; text-decoration:none;
        font-family:'DM Mono',monospace; font-size:0.72rem; letter-spacing:0.12em;
        text-transform:uppercase; padding:1em 2em;
        background:var(--accent); color:var(--bg); transition:background 0.2s;
      ">Ver proyecto ↗</a>`;
  }

  // Description
  document.getElementById('project-description').innerHTML = p.description;

  // Role
  document.getElementById('project-role').innerHTML = p.roleDescription;

  // Achievements
  const achEl = document.getElementById('project-achievements');
  achEl.innerHTML = p.achievements.map((a, i) =>
    `<li>
      <div class="achievement-icon">${String(i+1).padStart(2,'0')}</div>
      <span>${a}</span>
    </li>`
  ).join('');

  // Prev / next nav
  const navEl = document.getElementById('project-nav');
  const prevHTML = id > 0
    ? `<a href="project.html?id=${id-1}" class="project-nav-link prev">
        <span class="nav-link-label">Previous</span>
        <span class="nav-link-title">${PROJECTS[id-1].title}</span>
       </a>` : '<div></div>';

  const nextHTML = id < PROJECTS.length - 1
    ? `<a href="project.html?id=${id+1}" class="project-nav-link next">
        <span class="nav-link-label">Next</span>
        <span class="nav-link-title">${PROJECTS[id+1].title}</span>
       </a>` : '<div></div>';

  navEl.innerHTML = prevHTML + nextHTML;
}

// ─── Init ───
const currentId = getProjectId();
renderProject(currentId);

// Scroll reveal
const observer = new IntersectionObserver((entries) => {
  entries.forEach(e => {
    if (e.isIntersecting) {
      e.target.classList.add('visible');
      observer.unobserve(e.target);
    }
  });
}, { threshold: 0.08 });

document.querySelectorAll('.reveal').forEach((el, i) => {
  el.style.transitionDelay = (i * 0.1) + 's';
  observer.observe(el);
});
</script>
